name = "gyo6-law-info-ai"
main = "src/index.js"
compatibility_date = "2026-05-30"
workers_dev = true
preview_urls = false

[placement]
region = "aws:us-east-1"

[vars]
OPENAI_MODEL = "gpt-5.2"
OPENAI_FALLBACK_MODEL = "gpt-4.1"
OPENAI_KRW_PER_USD = "1500"
OPENAI_MONTHLY_WARN_USD = "10"
OPENAI_MONTHLY_STOP_USD = "50"
OPENAI_DAILY_CALL_LIMIT = "30"
OPENAI_COST_PRICING_DATE = "2026-05-30"
ALLOWED_ORIGINS = "https://gyo6.kr,https://www.gyo6.kr,https://gyo6-law-info.web.app,http://localhost:5173,http://127.0.0.1:5173"
